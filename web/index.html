<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LED Network Display - Preview</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    background: #0b0d10;
    color: #d8dee4;
    font-family: -apple-system, Segoe UI, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 1.5rem;
    touch-action: manipulation;
  }
  h1 { font-size: 1rem; font-weight: 500; color: #8b949e; letter-spacing: 0.05em; text-transform: uppercase; }
  #status { font-size: 0.85rem; color: #8b949e; }
  #status.connected { color: #3fb950; }
  #status.disconnected { color: #f85149; }
  canvas { background: #05060a; border-radius: 8px; border: 1px solid #21262d; max-width: 100%; height: auto; }
  .legend { display: flex; gap: 1.5rem; font-size: 0.85rem; }
  .legend span { display: inline-flex; align-items: center; gap: 0.4rem; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  #source-banner {
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.03em;
    padding: 0.35rem 0.9rem;
    border-radius: 999px;
    border: 1px solid transparent;
  }
  #source-banner.dummy { color: #d29922; background: rgba(210, 153, 34, 0.12); border-color: rgba(210, 153, 34, 0.4); }
  #source-banner.snmp { color: #f85149; background: rgba(248, 81, 73, 0.12); border-color: rgba(248, 81, 73, 0.4); }
  #version { font-size: 0.7rem; color: #4d5560; }
  #pause-btn {
    font-size: 0.8rem;
    color: #d8dee4;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 0.3rem 0.8rem;
    cursor: pointer;
  }
  #pause-btn:hover { background: #21262d; }
  #pause-btn.paused { color: #d29922; border-color: rgba(210, 153, 34, 0.4); }
  #pause-note { font-size: 0.75rem; color: #d29922; margin-bottom: -0.75rem; visibility: hidden; }
  #pause-note.visible { visibility: visible; }
  #inject-controls { display: flex; align-items: center; gap: 0.6rem; }
  #inject-controls button {
    font-size: 0.75rem;
    color: #d8dee4;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 0.25rem 0.7rem;
    cursor: pointer;
  }
  #inject-rx-btn:hover { border-color: rgba(0, 205, 255, 0.6); color: #00cdff; }
  #inject-tx-btn:hover { border-color: rgba(0, 255, 100, 0.6); color: #00ff64; }
  #inject-to-led-label {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    font-size: 0.75rem;
    color: #8b949e;
    cursor: pointer;
  }
</style>
</head>
<body>
  <h1>LED Network Display - Live Preview</h1>
  <div id="source-banner">checking data source…</div>
  <canvas id="strip" width="1200" height="80"></canvas>
  <div id="pause-note">only web-interface is paused</div>
  <button id="pause-btn">Pause</button>
  <div id="inject-controls">
    <button id="inject-rx-btn">Inject RX</button>
    <button id="inject-tx-btn">Inject TX</button>
    <label id="inject-to-led-label"><input type="checkbox" id="inject-to-led-checkbox"> Inject to LED strip</label>
  </div>
  <div class="legend">
    <span><span class="dot" style="background:#00ffff"></span>RX <span id="rx-rate">-</span></span>
    <span><span class="dot" style="background:#00ff00"></span>TX <span id="tx-rate">-</span></span>
  </div>
  <div id="status" class="disconnected">connecting…</div>
  <div id="version"></div>

<script>
const canvas = document.getElementById('strip');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const sourceBanner = document.getElementById('source-banner');
const rxRateEl = document.getElementById('rx-rate');
const txRateEl = document.getElementById('tx-rate');
const versionEl = document.getElementById('version');
const pauseBtn = document.getElementById('pause-btn');
const pauseNote = document.getElementById('pause-note');
const injectRxBtn = document.getElementById('inject-rx-btn');
const injectTxBtn = document.getElementById('inject-tx-btn');
const injectToLedCheckbox = document.getElementById('inject-to-led-checkbox');

function inject(direction) {
  fetch('/api/inject', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ direction }),
  }).catch(() => {});  // best-effort - a frame will just look normal if this fails
}
injectRxBtn.addEventListener('click', () => inject('rx'));
injectTxBtn.addEventListener('click', () => inject('tx'));

// Always starts unticked on a fresh page load, regardless of what any
// other tab has set server-side - not meant to be a remembered setting.
injectToLedCheckbox.addEventListener('change', () => {
  fetch('/api/inject-to-led', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ enabled: injectToLedCheckbox.checked }),
  }).catch(() => {});
});

const SEQUENCE = ['up','up','down','down','left','right','left','right','b','a'];
const SEQUENCE_TIMEOUT_MS = 5000;
let sequenceProgress = 0;
let lastSequenceStepTime = 0;

function stepMatches(step, expected) {
  if (step === expected) return true;
  return step === 'tap' && (expected === 'b' || expected === 'a');
}

function advanceSequence(step) {
  const now = Date.now();
  if (sequenceProgress > 0 && now - lastSequenceStepTime > SEQUENCE_TIMEOUT_MS) {
    sequenceProgress = 0;
  }
  if (stepMatches(step, SEQUENCE[sequenceProgress])) {
    sequenceProgress++;
    lastSequenceStepTime = now;
    if (sequenceProgress === SEQUENCE.length) {
      sequenceProgress = 0;
      fetch('/api/rainbow-burst', { method: 'POST' }).catch(() => {});
    }
  } else {
    sequenceProgress = stepMatches(step, SEQUENCE[0]) ? 1 : 0;
    lastSequenceStepTime = now;
  }
}

const KEY_STEPS = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', b: 'b', a: 'a' };
document.addEventListener('keydown', (e) => {
  const step = KEY_STEPS[e.key] || KEY_STEPS[e.key.toLowerCase()];
  if (step) advanceSequence(step);
});

let touchStart = null;
document.addEventListener('touchstart', (e) => {
  const t = e.changedTouches[0];
  touchStart = { x: t.clientX, y: t.clientY };
}, { passive: true });
document.addEventListener('touchmove', (e) => {
  if (!touchStart) return;
  const t = e.changedTouches[0];
  if (t.clientY - touchStart.y > 10 && window.scrollY <= 0) {
    e.preventDefault();
  }
}, { passive: false });
document.addEventListener('touchend', (e) => {
  if (!touchStart) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStart.x;
  const dy = t.clientY - touchStart.y;
  touchStart = null;
  const dist = Math.hypot(dx, dy);
  if (dist < 10) {
    advanceSequence('tap');
  } else if (dist > 30) {
    advanceSequence(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  }
});

// Client-side only - freezes what this browser tab renders, nothing
// server-side. The backend keeps polling/rendering/streaming frames the
// entire time; a paused tab just ignores them until resumed.
let paused = false;
pauseBtn.addEventListener('click', () => {
  paused = !paused;
  pauseBtn.textContent = paused ? 'Resume' : 'Pause';
  pauseBtn.classList.toggle('paused', paused);
  pauseNote.classList.toggle('visible', paused);
});

function formatRate(bytesPerSec) {
  const bits = bytesPerSec * 8;
  if (bits >= 1_000_000) return `${(bits / 1_000_000).toFixed(1)} Mbps`;
  if (bits >= 1_000) return `${(bits / 1_000).toFixed(1)} Kbps`;
  return `${bits.toFixed(0)} bps`;
}

function formatPortLabel(switchPort) {
  // ifName content is entirely vendor-defined free text (SNMP doesn't
  // standardize its format) - this only recognizes a couple of common
  // shapes and otherwise falls back to showing whatever the switch sent,
  // rather than assuming any particular vendor's convention.
  const slotPort = /^(\d+)\/(\d+)$/.exec(switchPort);
  if (slotPort) {
    const [, slot, port] = slotPort;
    return slot === '0' ? `Port ${port}` : `Slot ${slot}, Port ${port}`;
  }
  const bareNumber = /^(\d+)$/.exec(switchPort);
  if (bareNumber) return `Port ${bareNumber[1]}`;
  return switchPort;
}

function formatSysDescr(sysDescr) {
  // sysDescr content/format is entirely vendor-defined and often includes
  // a kernel build string (e.g. "..., Linux 3.6.5" or an agent whose
  // whole sysDescr IS just a kernel string) - that's implementation
  // trivia, not useful device info, so strip it off generically rather
  // than assuming any one vendor's exact format.
  const stripped = (sysDescr || '').replace(/,?\s*\bLinux\b.*$/i, '').trim();
  // An empty tooltip is indistinguishable from a broken one - say so
  // explicitly rather than leaving it blank.
  return stripped || '(no additional device info)';
}

async function loadSourceInfo() {
  try {
    const res = await fetch('/api/info');
    const info = await res.json();
    if (info.source === 'snmp') {
      sourceBanner.textContent = `LIVE DATA - ${info.switch_name} on ${info.host}, ${formatPortLabel(info.switch_port)}`;
      sourceBanner.className = 'snmp';
      sourceBanner.title = `${formatSysDescr(info.sys_descr)} (SNMP${info.snmp_version})`;
    } else {
      sourceBanner.textContent = 'DUMMY DATA - simulated traffic, not a real device';
      sourceBanner.className = 'dummy';
      sourceBanner.title = '';
    }
    versionEl.textContent = info.app_version || '';
  } catch (e) {
    sourceBanner.textContent = 'data source unknown (could not reach /api/info)';
  }
}
function connect() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const ws = new WebSocket(`${proto}//${location.host}/ws`);

  ws.onopen = () => {
    // Re-fetch on every (re)connect, not just once at page load - the
    // backend may have restarted with different config since we last
    // connected (e.g. dummy -> snmp), and the WebSocket reconnecting is
    // exactly the signal that's worth checking against.
    loadSourceInfo();
    statusEl.textContent = 'connected';
    statusEl.className = 'connected';
  };
  ws.onclose = () => {
    statusEl.textContent = 'disconnected - retrying…';
    statusEl.className = 'disconnected';
    setTimeout(connect, 1000);
  };
  ws.onerror = () => ws.close();

  ws.onmessage = (event) => {
    if (paused) return;  // still receiving frames, just not rendering them
    const msg = JSON.parse(event.data);
    const ledCount = msg.frame.length / 3;
    drawFrame(msg.frame, ledCount);
    rxRateEl.textContent = formatRate(msg.rx);
    txRateEl.textContent = formatRate(msg.tx);
  };
}

function drawFrame(flat, ledCount) {
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  const spacing = w / ledCount;
  const radius = Math.min(spacing * 0.4, h * 0.3);
  const cy = h / 2;

  for (let i = 0; i < ledCount; i++) {
    const r = flat[i * 3], g = flat[i * 3 + 1], b = flat[i * 3 + 2];
    const cx = spacing * (i + 0.5);

    // subtle glow for lit pixels
    if (r + g + b > 10) {
      const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius * 3);
      grad.addColorStop(0, `rgba(${r},${g},${b},0.5)`);
      grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(cx, cy, radius * 3, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.fill();
  }
}

connect();
</script>
</body>
</html>
