name: Build and publish Docker image

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*.*.*']  # e.g. v1.2.3 - triggers the semver-tagged release path below

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          # docker/metadata-action defaults to flavor "latest=auto" even
          # with no flavor: block declared at all - simply omitting it
          # (as this workflow used to) does NOT disable that default, it
          # was silently still tagging :latest on every semver release
          # despite this file having no explicit "latest" rule. Has to be
          # set to false explicitly. :latest is only ever meant to move
          # via promote.yml, run manually after checking out a release -
          # see .github/workflows/README.md.
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch,enable=${{ github.ref_name != 'main' }}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - id: version
        # major.minor.bugfix release tags (v1.2.3) win when that's what
        # triggered this build; anything else (branch push, manual
        # workflow_dispatch) falls back to the commit's short SHA.
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "value=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
