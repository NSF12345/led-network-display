name: Clean up untagged packages

on:
  schedule:
    - cron: '30 3 * * 0'  # weekly, Sunday 03:30 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (log what would be deleted, delete nothing)"
        required: true
        type: boolean
        default: true

permissions:
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          package: ${{ github.event.repository.name }}
          delete-untagged: true
          # Only untagged versions older than this are touched - tagged
          # versions (releases, :latest, :main, branch names) are never
          # deleted by this workflow regardless of age.
          older-than: 30 days
          # Scheduled runs always actually delete. A manual run defaults
          # to dry-run (see the input above) so you can sanity-check what
          # it *would* delete before trusting it unattended - flip the
          # input to false to actually run it by hand.
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
