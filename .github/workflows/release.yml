name: Create release tag

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        type: choice
        options: [major, minor, bugfix, manual]
        default: bugfix
      version:
        description: "Version if bump=manual, e.g. 0.1.0 (ignored otherwise)"
        required: false
        type: string

permissions:
  contents: write
  actions: write  # needed to explicitly trigger docker-publish.yml below

jobs:
  tag-release:
    runs-on: ubuntu-latest
    steps:
      - name: Guard - only allowed from main
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::This workflow can only be run from main (was run from ${{ github.ref }})"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need full tag history to find the latest release

      - name: Determine version
        id: ver
        run: |
          if [ "${{ inputs.bump }}" = "manual" ]; then
            version="${{ inputs.version }}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Version must be major.minor.patch (e.g. 0.1.0), got '$version'"
              exit 1
            fi
          else
            latest=$(git tag -l 'v*.*.*' | sed 's/^v//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
            latest="${latest:-0.0.0}"
            IFS='.' read -r major minor patch <<< "$latest"
            case "${{ inputs.bump }}" in
              major) major=$((major+1)); minor=0; patch=0 ;;
              minor) minor=$((minor+1)); patch=0 ;;
              bugfix) patch=$((patch+1)) ;;
            esac
            version="$major.$minor.$patch"
          fi
          echo "Latest tag found: ${latest:-none}, bump: ${{ inputs.bump }}, new version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.ver.outputs.version }}"
          git push origin "v${{ steps.ver.outputs.version }}"

      - name: Trigger the image build
        # A push made with GITHUB_TOKEN does NOT trigger other workflows
        # via the normal push-event chain (GitHub's own anti-loop
        # restriction) - so the tag push above alone would silently never
        # build an image. An explicit workflow_dispatch call like this is
        # allowed though, so trigger docker-publish.yml directly, against
        # the tag we just pushed.
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/docker-publish.yml/dispatches" \
            -d "{\"ref\":\"v${{ steps.ver.outputs.version }}\"}"
