services:
  led-network-display:
    # Published by .github/workflows/docker-publish.yml - :latest only
    # moves on a tagged release (see .github/workflows/release.yml), not
    # on every push to main. Package is public, no docker login needed.
    image: ghcr.io/nsf12345/led-network-display:latest
    container_name: led-network-display
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"  # web visualization - drop this once WLED output replaces it, or keep both